services:
  evernight:
    build:
      context: .
      dockerfile: Dockerfile
    image: evernight-mcp:local
    container_name: evernight-mcp
    ports:
      - "25924:25924"
    environment:
      SERVER_PORT: 25924
      MAVEN_REPOSITORY_REPOSITORIES: https://repo1.maven.org/maven2,https://maven.aliyun.com/repository/public
      NPM_REGISTRY_REPOSITORIES: https://registry.npmjs.org,https://registry.npmmirror.com
      PYPI_REPOSITORY_REPOSITORIES: https://pypi.org/pypi,https://pypi.tuna.tsinghua.edu.cn/pypi
      CARGO_REGISTRY_REPOSITORIES: https://crates.io/api/v1
      EVERNIGHT_HTTP_PROXY_URL:
      EVERNIGHT_HTTP_CONNECT_TIMEOUT_MILLIS: 5000
      EVERNIGHT_HTTP_READ_TIMEOUT_MILLIS: 10000
      EVERNIGHT_RATE_LIMIT_ENABLED: true
      EVERNIGHT_RATE_LIMIT_CLIENT_IP_HEADER: X-Evernight-Client-IP
      EVERNIGHT_RATE_LIMIT_MAX_REQUESTS: 120
      EVERNIGHT_RATE_LIMIT_WINDOW_SECONDS: 60
      EVERNIGHT_ONLINE_USERS_ENABLED: true
      EVERNIGHT_ONLINE_USERS_WINDOW_SECONDS: 300
      EVERNIGHT_ONLINE_USERS_MAXIMUM_SIZE: 100000
      EVERNIGHT_CACHE_ENABLED: true
      EVERNIGHT_CACHE_MAXIMUM_SIZE: 10000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:25924/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
